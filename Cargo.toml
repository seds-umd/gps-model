[package]
name = "gps"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "gps_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
cached = "0.53.1"
num-complex = "0.4.6"
numpy = "0.22.0"
pyo3 = { version = "0.22.5", features = ["extension-module", "num-complex"] }
rand = "0.8.5"
rayon = "1.10.0"

[dev-dependencies]
criterion = { version = "0.5" }

[[bench]]
name = "benchmarks"
harness = false
